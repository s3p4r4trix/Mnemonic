<div class="main-container">
  <header class="app-header">
    <h1 class="app-title">Mnemonic Trainer</h1>
    <div class="header-actions">
      <button
        mat-icon-button
        id="stats-button"
        type="button"
        aria-label="View memory stats"
        title="View memory stats"
        (click)="openStats()">
        <app-icon name="bar-chart" aria-hidden="true" />
      </button>
      <button
        mat-icon-button
        id="mute-toggle-button"
        type="button"
        [attr.aria-label]="muteAriaLabel"
        [attr.title]="muteAriaLabel"
        [attr.aria-pressed]="soundService.muted()"
        (click)="toggleMute()">
        @if (soundService.muted()) {
          <app-icon name="volume-off" aria-hidden="true" />
        } @else {
          <app-icon name="volume-on" aria-hidden="true" />
        }
      </button>
      <button
        mat-icon-button
        id="theme-toggle-button"
        type="button"
        [attr.aria-label]="themeAriaLabel"
        [attr.title]="themeAriaLabel"
        (click)="toggleTheme()">
        @if (currentTheme() === 'light') {
          <app-icon name="moon" aria-hidden="true" />
        } @else {
          <app-icon name="sun" aria-hidden="true" />
        }
      </button>
    </div>
  </header>
  <main>
    <app-game></app-game>
  </main>
</div>
