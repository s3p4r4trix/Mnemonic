<div class="main-container">
  <header class="app-header">
    <h1 class="app-title">Mnemonic Trainer</h1>
    <div class="header-actions">
      <button
        mat-icon-button
        id="stats-button"
        type="button"
        aria-label="View memory stats"
        title="View memory stats"
        (click)="openStats()">
        <mat-icon aria-hidden="true">bar_chart</mat-icon>
      </button>
      <button
        mat-icon-button
        id="mute-toggle-button"
        type="button"
        [attr.aria-label]="muteAriaLabel"
        [attr.title]="muteAriaLabel"
        [attr.aria-pressed]="soundService.muted()"
        (click)="toggleMute()">
        <mat-icon aria-hidden="true">{{ muteIcon }}</mat-icon>
      </button>
      <button
        mat-icon-button
        id="theme-toggle-button"
        type="button"
        [attr.aria-label]="themeAriaLabel"
        [attr.title]="themeAriaLabel"
        (click)="toggleTheme()">
        <mat-icon aria-hidden="true">{{ themeIcon }}</mat-icon>
      </button>
    </div>
  </header>
  <main>
    <app-game></app-game>
  </main>
</div>
