<h1 mat-dialog-title class="game-over-title">Game Over!</h1>
<div mat-dialog-content class="game-over">
  <div class="stats-container">
    <p>Level: {{ gameService.currentLevel() }}</p>
    <p>Tiles to remember: {{ gameService.numTilesToLight() }}</p>

    <span class="final-score-label">Final Score:</span>
    <span class="final-score-value">{{ gameService.score() }}</span>
  </div>
</div>
<div mat-dialog-actions align="end">
  <button mat-flat-button color="accent" (click)="onClose()">Close</button>
  <button mat-stroked-button color="primary" (click)="onRetryLevel()" class="retry-button">Retry Level</button>
  <button mat-flat-button color="primary" (click)="onPlayAgain()">Play Again</button>
</div>
